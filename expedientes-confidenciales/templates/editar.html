
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar expediente</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

<header>
    <h1>EDITAR EXPEDIENTE</h1>
    <p>Actualizar información del registro</p>
</header>

<main>
    <section>
        <form method="POST">

            <label>Código</label>
            <input type="text" name="codigo"
                   value="{{ expediente.codigo }}" required>

            <label>Nombre</label>
            <input type="text" name="nombre"
                   value="{{ expediente.nombre }}" required>

            <label>Apellido</label>
            <input type="text" name="apellido"
                   value="{{ expediente.apellido }}" required>

            <label>Fecha</label>
            <input type="date" name="fecha"
                   value="{{ expediente.fecha }}" required>

            <label>Descripción</label>
            <textarea name="descripcion"
                      rows="5" required>{{ expediente.descripcion_visible }}</textarea>

            <label>Desplazamiento César</label>
            <input type="number" name="desplazamiento"
                   min="0" max="25"
                   value="{{ expediente.desplazamiento }}" required>

            <button type="submit">Guardar cambios</button>

            <a href="{{ url_for('inicio') }}" class="volver">
                Regresar
            </a>

        </form>
    </section>
</main>

</body>
</html>
